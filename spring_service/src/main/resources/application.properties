spring.application.name=backend

# Recommended for development to avoid manual schema creation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Import local overrides (ignored if the file doesn't exist yet)
spring.config.import=optional:file:src/main/resources/application-local.properties

# Use PostgreSQL driver
spring.datasource.driver-class-name=org.postgresql.Driver
