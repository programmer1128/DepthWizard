# DepthWizard: static frontend + same-origin API proxy.
# Install: sudo cp deploy/nginx/depthwizard.conf /etc/nginx/sites-available/depthwizard
#          sudo ln -s /etc/nginx/sites-available/depthwizard /etc/nginx/sites-enabled/
# Then set server_name, and add TLS (e.g. certbot --nginx).

upstream depthwizard_backend {
    server 127.0.0.1:8081;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # Frontend build (frontend checkout: npm ci && npm run build).
    root /var/www/depthwizard;
    index index.html;

    # GeoTIFF uploads (backend accepts up to 200 MB).
    client_max_body_size 200m;

    # API: only /api/ reaches the backend. A reconstruction can run for many
    # minutes (model inference, SAT2LoD2 cold start), so the timeouts exceed
    # the backend's idle_connection_timeout (1200 s).
    location /api/ {
        proxy_pass http://depthwizard_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1300s;
        proxy_read_timeout 1300s;
        send_timeout 1300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Hashed build assets: cache for a long time.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Draco decoder and other static files from public/.
    location ~* \.(wasm)$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }

    # Single-page app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary application/wasm;
}
